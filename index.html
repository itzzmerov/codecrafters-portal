<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCrafters - Employee Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">CodeCrafters</div>
        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </nav>
    </header>

    <main class="container">
        <h1>Welcome back, Employee!</h1>
        <div class="grid">
            <div class="card">
                <h3>System Status</h3>
                <p id="status">Loading...</p>
            </div>
            <div class="card">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="#">Internal Wiki</a></li>
                    <li><a href="#">HR Portal</a></li>
                    <li><a href="#">IT Support</a></li>
                </ul>
            </div>
            <div class="card">
                <h3>Recent Activity</h3>
                <p>No new alerts.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CodeCrafters Inc. Internal Use Only.</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
